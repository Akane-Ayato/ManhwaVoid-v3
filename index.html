<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#121214" />
    <meta name="description" content="Read manga, manhwa, manhua and webtoons online on Manhwa Void." />

    <!-- Icons -->
    <link rel="icon" type="image/x-icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />

    <!-- PWA: Android / Windows / Linux (Chromium) read the manifest; iOS reads the apple-* tags -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="application-name" content="Manhwa Void" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Manhwa Void" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="msapplication-TileColor" content="#121214" />
    <meta name="msapplication-TileImage" content="/icons/mstile-150.png" />
    <meta name="msapplication-config" content="/browserconfig.xml" />

    <!-- Social previews (set an absolute URL for og:image once you know your domain) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Manhwa Void" />
    <meta property="og:title" content="Manhwa Void — Read Manga Online" />
    <meta property="og:description" content="Read manga, manhwa, manhua and webtoons online." />
    <meta property="og:image" content="/og-image.png" />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preload" href="/fonts/cinzel-decorative-latin-900-normal.woff2" as="font" type="font/woff2" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <title>Manhwa Void — Read Manga Online</title>
    <script>
      // Apply the saved theme before first paint to avoid a flash.
      try { document.documentElement.dataset.theme = localStorage.getItem('mhq_theme') === 'light' ? 'light' : 'dark'; } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
